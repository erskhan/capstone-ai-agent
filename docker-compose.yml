version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: loan-approval-db
    environment:
      MYSQL_ROOT_PASSWORD: WP@12345
      MYSQL_DATABASE: loan_approval_dev
      MYSQL_USER: loanuser
      MYSQL_PASSWORD: loanpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loan-approval-api
    environment:
      DATABASE_URL: mysql+pymysql://root:WP@12345@db:3306/loan_approval_dev
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DEBUG: "true"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loan-approval-ui
    environment:
      DATABASE_URL: mysql+pymysql://root:WP@12345@db:3306/loan_approval_dev
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
      - db
    volumes:
      - .:/app
    command: streamlit run frontend/app.py --server.address=0.0.0.0

volumes:
  mysql_data:
