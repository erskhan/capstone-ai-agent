version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: loan-approval-db
    environment:
      POSTGRES_USER: loanuser
      POSTGRES_PASSWORD: loanpass
      POSTGRES_DB: loan_approval_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loan-approval-api
    environment:
      DATABASE_URL: postgresql://loanuser:loanpass@db:5432/loan_approval_dev
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DEBUG: "true"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loan-approval-ui
    environment:
      DATABASE_URL: postgresql://loanuser:loanpass@db:5432/loan_approval_dev
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
      - db
    volumes:
      - .:/app
    command: streamlit run frontend/app.py --server.address=0.0.0.0

volumes:
  postgres_data:
